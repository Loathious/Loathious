name: Stats

on:
  schedule:
    - cron: "23 3 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: stats
  cancel-in-progress: false

jobs:
  stats:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Draw assets/stats.svg
        env:
          STATS_TOKEN: ${{ secrets.STATS_TOKEN }}
          STATS_REPOS: ${{ secrets.STATS_REPOS }}
        run: python3 stats/stats.py

      - name: Commit the new card
        run: |
          if git diff --quiet -- assets/stats.svg; then
            echo "assets/stats.svg is unchanged."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/stats.svg
          git commit -m "Update stats"
          git push
